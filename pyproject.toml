[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-bullshit-linter"
version = "1.0.0"
description = "A ruthless, irreverent CLI linter that de-masks academic gatekeeping, corporate therapy-speak, and performative posturing."
readme = "README.md"
authors = [{ name = "Patrick Isles" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.scripts]
cbl = "cbl.cli:main"
